interface:
  display_name: "(OmO) lcx-contribute-bug-fix"
  short_description: "Contribute verified LazyGrok or Grok bug fixes"
  search_terms:
    - "lcx-contribute-bug-fix"
    - "contribute a bug fix"
    - "contribute to fix bug"
    - "fix bug pr"
    - "lazygrok fix"
    - "omo-codex bug fix"
    - "codex bug fix pr"
  default_prompt: "Use $lcx-contribute-bug-fix to debug this LazyGrok or Grok bug, work from a fresh ${TMPDIR:-/tmp} clone and worktree, implement the smallest verified fix, apply the lazygrok-generated label, deliver it to ThewindMom/lazygrok or xai-org/grok-build as requested, and clean up."
