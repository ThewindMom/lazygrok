interface:
  display_name: "(OmO) lcx-doctor"
  short_description: "Diagnose LazyGrok/Grok install health against latest sources"
  search_terms:
    - "lcx-doctor"
    - "lazygrok doctor"
    - "lazygrok health check"
    - "codex doctor"
    - "lazygrok install broken"
    - "omo-codex diagnose"
  default_prompt: "Use $lcx-doctor to sync the latest LazyGrok and Grok sources under LAZYCODEX_SOURCE_ROOT or ${TMPDIR:-/tmp}/lazygrok-sources, inventory the local installation, compare versions, config, and wiring against the latest sources, probe the real surface, and report PASS/WARN/FAIL findings with evidence and remediations."
