interface:
  display_name: "(OmO) lcx-report-bug"
  short_description: "Route LazyGrok or Grok bugs with source evidence"
  search_terms:
    - "lcx-report-bug"
    - "lazygrok bug"
    - "lazygrok issue"
    - "omo-codex bug"
    - "openai codex bug"
    - "codex upstream issue"
  default_prompt: "Use $lcx-report-bug to investigate this LazyGrok or Grok bug, compare LazyGrok evidence with sources under LAZYCODEX_SOURCE_ROOT or ${TMPDIR:-/tmp}/lazygrok-sources, choose the correct GitHub repo, and file an issue (or, for openai/codex only, a PR — never a PR on code-yeongyu/lazygrok) with reproduction, root cause, fix guidance, and the lazygrok-generated label and footer."
